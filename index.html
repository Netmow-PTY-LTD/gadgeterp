<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gadget ERP Pro</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
<div class="sidebar">
<h3><i class="fa-solid fa-mobile-screen"></i> GadgetERP</h3>
<a><i class="fa fa-chart-line"></i> Dashboard</a>
<a><i class="fa fa-building"></i> Branch Management</a>
<a><i class="fa fa-mobile"></i> Gadget Inventory</a>
<a><i class="fa fa-recycle"></i> Trade-In</a>
<a><i class="fa fa-screwdriver-wrench"></i> Repair Center</a>
<a><i class="fa fa-box"></i> Stock</a>
<a><i class="fa fa-file-invoice"></i> Purchase</a>
<a><i class="fa fa-users"></i> Customers</a>
<a><i class="fa fa-chart-pie"></i> Reports</a>
</div>

<div class="content">
<h2>Management Dashboard</h2>

<div class="row g-3">
<div class="col-md-3"><div class="cardbox">Total Devices<h2>1,248</h2></div></div>
<div class="col-md-3"><div class="cardbox">Today's Sales<h2>RM 28,450</h2></div></div>
<div class="col-md-3"><div class="cardbox">Profit<h2>RM 8,920</h2></div></div>
<div class="col-md-3"><div class="cardbox">Repair Queue<h2>48</h2></div></div>
</div>

<div class="panel mt-4">
<h4>Device Inventory</h4>
<button class="btn btn-primary" onclick="addDevice()">+ Add Device</button>
<table class="table mt-3">
<thead><tr><th>Device</th><th>IMEI</th><th>Cost</th><th>Status</th><th>Action</th></tr></thead>
<tbody id="devices"></tbody>
</table>
</div>

<div class="panel mt-4">
<canvas id="salesChart"></canvas>
</div>
</div>

<div class="modal" id="modal">
<div class="modal-box">
<h3>Add Device</h3>
<input id="name" class="form-control mb-2" placeholder="Device Name">
<input id="imei" class="form-control mb-2" placeholder="IMEI">
<input id="cost" class="form-control mb-2" placeholder="Cost">
<button class="btn btn-success" onclick="saveDevice()">Save</button>
</div>
</div>

<script src="database.js"></script>
<script src="app.js"></script>
</body>
</html>
